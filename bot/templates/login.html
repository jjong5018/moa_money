<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 · Moa Money</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
</head>
<body class="login-page">
  <div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>
  <main class="login-shell">
    <section class="login-card" aria-labelledby="loginTitle">
      <div class="login-brand"><div class="brand-mark" aria-hidden="true">M</div><div><strong>Moa Money</strong><span>자동매매 워크스페이스</span></div></div>
      <p class="eyebrow">SECURE ACCESS</p>
      <h1 id="loginTitle">대시보드 로그인</h1>
      <p class="login-copy">계좌와 자동매매 설정을 확인하려면 로그인하세요.</p>
      <form method="post" action="{{ url_for('login') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <input type="hidden" name="next" value="{{ next_url }}">
        <div class="field-group"><label for="username">아이디</label><input id="username" name="username" value="{{ entered_username|default('') }}" autocomplete="username" required autofocus></div>
        <div class="field-group"><label for="password">비밀번호</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
        {% if error %}<p class="login-error" role="alert">{{ error }}</p>{% endif %}
        <button type="submit" class="button primary login-button">로그인</button>
      </form>
      <p class="login-footnote">접속 정보는 암호화된 HTTPS 연결에서만 전송하세요.</p>
    </section>
  </main>
</body>
</html>
